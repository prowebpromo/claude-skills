name: Validate bundled skills

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/skills-manager/requirements-test.txt
      - name: Validate descriptions and offline manager behavior
        run: python -m unittest discover -s tests -v
